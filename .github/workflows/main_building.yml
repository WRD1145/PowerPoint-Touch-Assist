name: Build Release

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  build:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'v')
    runs-on: windows-latest
    
    steps:
      - name: Checkout merged code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Extract version and body
        id: extract
        shell: pwsh
        run: |
          $title = "${{ github.event.pull_request.title }}"
          $body = "${{ github.event.pull_request.body }}"
          "version=$title" >> $env:GITHUB_OUTPUT
          "body<<EOF" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache dependencies
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: venv
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          venv\Scripts\activate
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Inject hardcoded telemetry
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          $dsn = "$env:SENTRY_DSN"
          $version = "${{ steps.extract.outputs.version }}"
          $content = @"
          # 遥测
          import sentry_sdk
          sentry_sdk.init(
              dsn="$dsn",
              environment="production",
              release="$version",
              traces_sample_rate=1.0
          )
          "@
          # 读取 main.py
          $main = Get-Content main.py -Raw
          # 替换遥测部分
          $pattern = '# 遥测[\s\S]*?else:\s*print\("SENTRY_DSN not set, skipping Sentry initialization"\)'
          $main = $main -replace $pattern, $content.Trim()
          # 写回
          Set-Content main.py $main -NoNewline
          Write-Host "Telemetry injected successfully"

      - name: Build with PyInstaller
        run: |
          venv\Scripts\activate
          pyinstaller -w -i icon.ico -n PowerPoint-Touch-Assist `
            --add-data "main.ui;." `
            --add-data "settings.ui;." `
            --add-data "img;img" `
            --add-data "icon.png;." `
            main.py

      - name: Zip artifact
        run: |
          Compress-Archive -Path dist/PowerPoint-Touch-Assist/* -DestinationPath dist/PowerPoint-Touch-Assist.zip

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.extract.outputs.version }}
          name: ${{ steps.extract.outputs.version }}
          body: ${{ steps.extract.outputs.body }}
          files: dist/PowerPoint-Touch-Assist.zip
