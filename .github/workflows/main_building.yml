name: Build Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'v')) ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v'))
    
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-python@v6  # 使用 v6（如果存在）
        with:
          python-version: '3.11'

      - name: Extract version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $msg = "${{ github.event.pull_request.title }}"
          } else {
            $msg = ("${{ github.event.head_commit.message }}" -split "`r?`n")[0]
          }
          $version = $msg -replace '^v', ''
          $isPre = $version -match '-(alpha|beta|rc|pre)'
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "is_prerelease=$isPre" >> $env:GITHUB_OUTPUT

      - name: Update _version.py
        shell: pwsh
        run: |
          "__version__ = `"${{ steps.ver.outputs.version }}`"" | Set-Content "_version.py"

      - name: Install deps
        shell: pwsh
        run: |
          python -m venv venv
          venv\Scripts\activate
          pip install -r requirements.txt pyinstaller

      - name: Inject Sentry & Build
        shell: pwsh
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          New-Item -ItemType Directory -Force -Path "resources" | Out-Null
          @{
            dsn = $env:SENTRY_DSN
            environment = "production"
            release = "${{ steps.ver.outputs.version }}"
            traces_sample_rate = 0.1
          } | ConvertTo-Json | Set-Content "resources/telemetry.json"
          
          pyinstaller -w -i icon.ico -n "PowerPoint-Touch-Assist" `
            --add-data "main.ui;." `
            --add-data "settings.ui;." `
            --add-data "img;img" `
            --add-data "icon.png;." `
            --add-data "resources;resources" `
            main.py
          
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path "dist/PowerPoint-Touch-Assist/*" -DestinationPath "dist/PowerPoint-Touch-Assist-v$v.zip"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $pre = "${{ steps.ver.outputs.is_prerelease }}"
          gh release create $tag dist/PowerPoint-Touch-Assist-v${{ steps.ver.outputs.version }}.zip `
            --title $tag --generate-notes $(if($pre -eq "True"){"--prerelease"})

      - name: Cleanup
        if: always()
        run: Remove-Item "resources/telemetry.json" -Force -ErrorAction SilentlyContinue